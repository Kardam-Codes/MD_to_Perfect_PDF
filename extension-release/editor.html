<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD &#10132; Perfect PDF</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <nav class="topbar">
    <div class="brand">MD &#10132; Perfect PDF</div>
    <div class="actions">
      <label class="topbar-field" for="fontSelect">
        <span>Font</span>
        <select id="fontSelect" aria-label="Editor font">
          <option value="system" selected>System UI</option>
          <option value="arial">Arial</option>
          <option value="verdana">Verdana</option>
          <option value="tahoma">Tahoma</option>
          <option value="trebuchet">Trebuchet MS</option>
          <option value="georgia">Georgia</option>
          <option value="times">Times New Roman</option>
          <option value="palatino">Palatino</option>
          <option value="garamond">Garamond</option>
          <option value="source_code">Source Code Style</option>
        </select>
      </label>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path fill="currentColor" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button id="download" class="primary-btn" title="Export PDF">Export PDF</button>
    </div>
  </nav>

  <main id="workspace">
    <section class="pane">
      <textarea id="editor" placeholder="Paste Markdown here..." spellcheck="false"></textarea>
    </section>
    <div id="resizer"></div>
    <section class="pane preview-pane">
      <div id="preview"></div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <div id="exportModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="exportTitle">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card" role="document">
      <div class="modal-head">
        <h2 id="exportTitle">Export PDF</h2>
        <button id="exportClose" class="icon-btn" aria-label="Close export dialog">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <span>Theme</span>
          <div class="segmented">
            <label><input type="radio" name="pdfTheme" value="match" checked><span>Match</span></label>
            <label><input type="radio" name="pdfTheme" value="dark"><span>Dark</span></label>
            <label><input type="radio" name="pdfTheme" value="light"><span>Light</span></label>
          </div>
        </div>
        <div class="field">
          <span>Page size</span>
          <div class="segmented">
            <label><input type="radio" name="pdfPageSize" value="A4" checked><span>A4</span></label>
            <label><input type="radio" name="pdfPageSize" value="Letter"><span>Letter</span></label>
            <label><input type="radio" name="pdfPageSize" value="Legal"><span>Legal</span></label>
          </div>
        </div>
        <div class="field">
          <span>Orientation</span>
          <div class="segmented">
            <label><input type="radio" name="pdfOrientation" value="portrait" checked><span>Portrait</span></label>
            <label><input type="radio" name="pdfOrientation" value="landscape"><span>Landscape</span></label>
          </div>
        </div>
        <label class="field">
          <span>Font</span>
          <select id="pdfFont">
            <option value="match" selected>Match editor</option>
            <option value="system">System UI</option>
            <option value="arial">Arial</option>
            <option value="verdana">Verdana</option>
            <option value="tahoma">Tahoma</option>
            <option value="trebuchet">Trebuchet MS</option>
            <option value="georgia">Georgia</option>
            <option value="times">Times New Roman</option>
            <option value="palatino">Palatino</option>
            <option value="garamond">Garamond</option>
            <option value="source_code">Source Code Style</option>
          </select>
        </label>
        <p id="fontPreviewText" class="font-preview">Preview Font for the PDF</p>
      </div>
      <div class="modal-foot">
        <button id="exportCancel" class="btn-ghost">Cancel</button>
        <button id="exportConfirm" class="primary-btn">Continue</button>
      </div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script type="module" src="editorController.js"></script>
</body>
</html>
